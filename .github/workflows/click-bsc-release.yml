---
# Builds the bsc geth binary from this fork and publishes it as a release asset,
# so ansible-bsc installs a binary we built instead of bnb-chain's prebuilt
# geth_linux. mainnet.zip rides along so one version drives both URLs in the
# role. Branch model: CLICK.md.
name: click · geth_linux → release

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "Tag, branch or SHA to build"
        required: true
        default: v1.7.8
      suffix:
        description: "Release-tag suffix appended to the upstream ref"
        required: true
        default: click1
      publish:
        description: "Publish the release (off = build only, artifact kept for 7 days)"
        required: false
        default: true
        type: boolean
      runner:
        description: "Where to build. ubuntu-22.04 is free on a public repo and its glibc (2.35) is older than the target host's, which is the safe direction. The self-hosted sets need a runner group that allows public repositories -- see CLICK.md."
        required: false
        default: ubuntu-22.04
        type: choice
        options:
          - ubuntu-22.04
          - ubuntu-latest
          - lat-fra2-runners

  # Weekly, on the default branch (the only branch a schedule ever runs on).
  # Tuesday 04:23 UTC: outside the Sunday 01:00-05:00 kured window, and off the
  # hour so it does not queue behind every other cron in the org.
  #
  # GitHub disables a schedule after 60 days without repository activity. The
  # weekly CodeQL run on this repo keeps it alive; if that ever goes away, this
  # stops silently and the only symptom is an empty Actions history.
  schedule:
    - cron: "23 4 * * 2"

permissions:
  contents: write

concurrency:
  group: click-bsc-${{ inputs.upstream_ref || 'scheduled' }}-${{ inputs.suffix || 'auto' }}
  cancel-in-progress: false

jobs:
  # A pipeline needs something that decides, not only something that builds.
  # This job is that decision, and it is the only place where "what are we
  # building" is answered: on a dispatch it passes the operator's four inputs
  # through untouched, and on the weekly schedule it asks bnb-chain what their
  # latest stable release is and whether we have already built it.
  #
  # Why this exists at all: the fork sat on v1.7.8-click1 while upstream shipped
  # v1.8.1 (2026-10-16) and nobody noticed, because a workflow_dispatch-only
  # build is a button, not a pipeline. The role kept downloading bnb-chain's
  # prebuilt binary, which is the thing this repository was created to stop.
  resolve:
    name: resolve
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      build: ${{ steps.pick.outputs.build }}
      upstream_ref: ${{ steps.pick.outputs.upstream_ref }}
      commit: ${{ steps.pick.outputs.commit }}
      suffix: ${{ steps.pick.outputs.suffix }}
      publish: ${{ steps.pick.outputs.publish }}
      runner: ${{ steps.pick.outputs.runner }}
      release_tag: ${{ steps.pick.outputs.release_tag }}

    steps:
      - name: Pick the upstream ref
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_REPO: bnb-chain/bsc
        run: |
          set -euo pipefail

          REF='${{ inputs.upstream_ref }}'
          SUFFIX='${{ inputs.suffix }}'
          PUBLISH='${{ inputs.publish }}'
          RUNNER='${{ inputs.runner }}'

          SCHEDULED=false
          [ '${{ github.event_name }}' = 'schedule' ] && SCHEDULED=true

          # A schedule carries no inputs at all. Every one of the four is the
          # empty string -- NOT the dispatch default, which only the form fills
          # in. Default them here so the build job never has to care which
          # event started it.
          if [ -z "$REF" ]; then
            REF=$(gh api "repos/${UPSTREAM_REPO}/releases/latest" --jq .tag_name)
            echo "upstream latest stable release: ${REF}"
          fi
          [ -n "$SUFFIX" ]  || SUFFIX=click1
          [ -n "$PUBLISH" ] || PUBLISH=true
          [ -n "$RUNNER" ]  || RUNNER=ubuntu-22.04

          # /releases/latest already excludes drafts and pre-releases, but it
          # promises nothing about the NAME: v1.8.0-alpha was published upstream
          # as a pre-release, and the day a release like it is not flagged as
          # one, an unattended build must not quietly produce a binary from it.
          # Only a plain vX.Y.Z builds on a schedule; anything else needs a
          # human to dispatch it by name.
          if [ "$SCHEDULED" = true ] && ! printf '%s' "$REF" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::warning::${REF} is not a plain vX.Y.Z tag, so this scheduled run will not build it. Dispatch it by hand if that is what you want."
            echo "build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          RELEASE_TAG="${REF}-${SUFFIX}"

          # Resolve the tag to a commit NOW and make the build assert it later.
          # A tag is a moving reference: upstream can repoint it, and without
          # this the thing we inspected here and the thing we compile there are
          # only probably the same object. ^{} dereferences an annotated tag to
          # its commit; the bare ref is the fallback for a lightweight one.
          BASE="https://github.com/${UPSTREAM_REPO}.git"
          COMMIT=$(git ls-remote "$BASE" "refs/tags/${REF}^{}" | cut -f1)
          [ -n "$COMMIT" ] || COMMIT=$(git ls-remote "$BASE" "refs/tags/${REF}" | cut -f1)
          if [ -z "$COMMIT" ]; then
            echo "::error::${REF} is not a tag in ${UPSTREAM_REPO}."
            exit 1
          fi

          # Idempotence. A weekly run that finds its release already published
          # is a no-op, not a failure -- on a dispatch the build job's own
          # refusal still errors loudly, because an operator who asked for this
          # release by name wants to be told, not silently skipped.
          BUILD=true
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if [ "$SCHEDULED" = true ]; then
              echo "${RELEASE_TAG} is already published; nothing to do."
              BUILD=false
            fi
          fi

          {
            echo "build=${BUILD}"
            echo "upstream_ref=${REF}"
            echo "commit=${COMMIT}"
            echo "suffix=${SUFFIX}"
            echo "publish=${PUBLISH}"
            echo "runner=${RUNNER}"
            echo "release_tag=${RELEASE_TAG}"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### resolve"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| event | \`${{ github.event_name }}\` |"
            echo "| upstream ref | \`${REF}\` |"
            echo "| commit | \`${COMMIT}\` |"
            echo "| release tag | \`${RELEASE_TAG}\` |"
            echo "| will build | \`${BUILD}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: geth_linux @ ${{ needs.resolve.outputs.upstream_ref }}
    needs: resolve
    if: needs.resolve.outputs.build == 'true'
    runs-on: ${{ needs.resolve.outputs.runner }}
    timeout-minutes: 60

    env:
      # Where the chain config comes from. bnb-chain ships config.toml +
      # genesis.json as mainnet.zip on its own releases; we re-attach it to ours
      # so bsc_release_tag alone decides both downloads in the role.
      UPSTREAM_REPO: bnb-chain/bsc
      RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
      # The branch in this fork that holds Click's code. Point it at a new
      # click-vX.Y.Z branch when the patches are ported to a new upstream release.
      PATCH_BRANCH: click-v1.7.8

    steps:
      - name: Refuse to overwrite an existing release
        if: needs.resolve.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release ${RELEASE_TAG} already exists. Bump the suffix (click2, …) instead of replacing a binary that hosts may already run."
            exit 1
          fi

      # Checked out from bnb-chain, not from this fork, and that is the change
      # that turns the button into a pipeline. Our own code is applied on top in
      # the next steps, from PATCH_BRANCH. `click` only holds the tags that
      # existed when the fork was made.
      # Building v1.8.1 from here would first require pushing that tag into this
      # repository, and a tag push whose tree carries upstream's 12 workflow
      # files is exactly what CLICK.md's branch model exists to avoid. Reading
      # the ref from upstream at build time needs no push at all.
      #
      # fetch-tags matters: `make geth` stamps the binary from the tag that
      # points at HEAD, so a bare-commit checkout would produce a geth that
      # reports no version.
      - name: Checkout ${{ needs.resolve.outputs.upstream_ref }} from bnb-chain/bsc
        uses: actions/checkout@v4
        with:
          repository: bnb-chain/bsc
          ref: ${{ needs.resolve.outputs.upstream_ref }}
          fetch-depth: 1
          fetch-tags: true

      # The resolve job turned that tag into a sha before this job started.
      # Tags move; if this one moved in between, stop rather than publish a
      # binary built from code nobody looked at.
      - name: Assert the checkout matches the resolved commit
        env:
          EXPECTED: ${{ needs.resolve.outputs.commit }}
        run: |
          set -euo pipefail
          ACTUAL=$(git rev-parse HEAD)
          echo "resolved by the resolve job: ${EXPECTED}"
          echo "checked out here:            ${ACTUAL}"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::${{ needs.resolve.outputs.upstream_ref }} moved between resolve and build. Refusing to build it."
            exit 1
          fi

      # Our code lives on PATCH_BRANCH, a click-vX.Y.Z branch cut from upstream's
      # vX.Y.Z. Its commits since that tag are cherry-picked onto the tag being
      # built: merge commits and the commit that only removes upstream's
      # workflows are skipped. A conflict stops the run; it means the patches
      # need porting to the new upstream release on a new click-v branch.
      - name: Apply Click's patches from ${{ env.PATCH_BRANCH }}
        id: patches
        run: |
          set -euo pipefail
          BASE_TAG="${PATCH_BRANCH#click-}"
          git config user.name "click-bsc-release"
          git config user.email "click-bsc-release@users.noreply.github.com"
          git fetch --no-tags --depth=50 "https://github.com/${GITHUB_REPOSITORY}.git" \
            "refs/heads/${PATCH_BRANCH}:refs/patches/head"
          BASE_SHA=$(git ls-remote "https://github.com/${UPSTREAM_REPO}.git" "refs/tags/${BASE_TAG}^{}" | cut -f1)
          [ -n "$BASE_SHA" ] || BASE_SHA=$(git ls-remote "https://github.com/${UPSTREAM_REPO}.git" "refs/tags/${BASE_TAG}" | cut -f1)
          if [ -z "$BASE_SHA" ] || ! git merge-base --is-ancestor "$BASE_SHA" refs/patches/head; then
            echo "::error::${PATCH_BRANCH} does not descend from upstream ${BASE_TAG}."
            exit 1
          fi
          COMMITS=$(git rev-list --reverse --no-merges "${BASE_SHA}..refs/patches/head" -- . ':(exclude).github')
          if [ -z "$COMMITS" ]; then
            echo "::error::${PATCH_BRANCH} has no commits to apply since ${BASE_TAG}."
            exit 1
          fi
          echo "Applying onto ${{ needs.resolve.outputs.upstream_ref }}:"
          git log --no-walk --format='  %h %s' $COMMITS
          if ! git cherry-pick $COMMITS; then
            git cherry-pick --abort || true
            echo "::error::Click's patches from ${PATCH_BRANCH} do not apply to ${{ needs.resolve.outputs.upstream_ref }}. Port them to a click-<that release> branch and point PATCH_BRANCH at it."
            exit 1
          fi
          {
            echo "list<<EOF"
            git log --no-walk --format='- %h %s' $COMMITS
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build geth
        run: make geth
        env:
          # internal/build/env.go stamps the binary from GITHUB_SHA when it sees
          # CI=true + GITHUB_ACTIONS=true. On a workflow_dispatch GITHUB_SHA is
          # the click HEAD, which is not an object in a checkout of the upstream
          # tag, so `git show -s --format=%ct` fails and the build dies. Clearing
          # CI sends it down the LocalEnv() path, which reads the detached HEAD we
          # actually checked out -- the correct commit to stamp. GITHUB_* vars are
          # reserved and cannot be overridden; CI is an ordinary one.
          CI: ""
          # Mirrors bnb-chain's own release workflow.
          CGO_CFLAGS_ALLOW: "-O -D__BLST_PORTABLE__"

      - name: Package the binary
        id: pkg
        run: |
          set -euo pipefail
          mkdir -p dist
          install -m 0755 build/bin/geth dist/geth_linux

          echo "--- version ---"
          ./dist/geth_linux version

          # The runner image is Ubuntu 22.04 (glibc 2.35) and the hosts are newer,
          # so this binary is forward-compatible. Print the highest glibc symbol it
          # needs, so the day that stops being true is visible here and not on the
          # node at service start.
          echo "--- dynamic linking ---"
          ldd dist/geth_linux || true
          MAXGLIBC=$(objdump -T dist/geth_linux 2>/dev/null \
            | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -V | tail -1 || true)
          echo "max glibc required: ${MAXGLIBC:-none (static)}"

          cd dist
          sha256sum geth_linux > geth_linux.sha256
          SHA=$(cut -d' ' -f1 geth_linux.sha256)
          {
            echo "sha256=${SHA}"
            echo "maxglibc=${MAXGLIBC:-static}"
            echo "commit=$(git -C .. rev-parse HEAD)"
            echo "goversion=$(go version | awk '{print $3}')"
          } >> "$GITHUB_OUTPUT"

      - name: Fetch the matching mainnet.zip from upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "${{ needs.resolve.outputs.upstream_ref }}" \
            --repo "$UPSTREAM_REPO" \
            --pattern mainnet.zip \
            --dir dist
          unzip -l dist/mainnet.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: geth_linux-${{ needs.resolve.outputs.upstream_ref }}
          path: dist/
          retention-days: 7

      - name: Publish the release
        if: needs.resolve.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > /tmp/notes.md <<EOF
          Built by \`.github/workflows/click-bsc-release.yml\` for ansible-bsc.

          | | |
          |---|---|
          | upstream ref | \`${{ needs.resolve.outputs.upstream_ref }}\` (${UPSTREAM_REPO}) |
          | upstream commit | \`${{ needs.resolve.outputs.commit }}\` |
          | built commit | \`${{ steps.pkg.outputs.commit }}\` (upstream + Click's patches) |
          | patches from | \`${PATCH_BRANCH}\` |
          | go | \`${{ steps.pkg.outputs.goversion }}\` |
          | geth_linux sha256 | \`${{ steps.pkg.outputs.sha256 }}\` |
          | max glibc required | \`${{ steps.pkg.outputs.maxglibc }}\` |
          | run | [\`${GITHUB_RUN_ID}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}) |

          Click's patches:

          ${{ steps.patches.outputs.list }}

          \`mainnet.zip\` is upstream's, re-attached unchanged so one variable drives
          both downloads in the role.

          \`\`\`yaml
          # rke2/<cluster>/inventory/host_vars/bsc-01 (or ansible-bsc defaults)
          bsc_version: ${{ needs.resolve.outputs.upstream_ref }}
          bsc_release_tag: ${RELEASE_TAG}
          bsc_geth_sha256: "${{ steps.pkg.outputs.sha256 }}"
          \`\`\`
          EOF

          # Target the click branch, never the upstream commit: a tag whose tree
          # carries upstream's .github/workflows could fire bnb-chain's own
          # release pipeline on this fork. The notes above record what was built.
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target click \
            --title "$RELEASE_TAG" \
            --notes-file /tmp/notes.md \
            dist/geth_linux dist/geth_linux.sha256 dist/mainnet.zip

      - name: Summary
        if: success()
        run: |
          {
            echo "### bsc geth"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| upstream ref | \`${{ needs.resolve.outputs.upstream_ref }}\` |"
            echo "| commit | \`${{ steps.pkg.outputs.commit }}\` |"
            echo "| sha256 | \`${{ steps.pkg.outputs.sha256 }}\` |"
            echo "| max glibc | \`${{ steps.pkg.outputs.maxglibc }}\` |"
            echo "| published | \`${{ needs.resolve.outputs.publish }}\` |"
            echo
            echo "Set in \`ansible-bsc/defaults/main.yml\`:"
            echo
            echo '```yaml'
            echo "bsc_release_tag: ${RELEASE_TAG}"
            echo "bsc_geth_sha256: \"${{ steps.pkg.outputs.sha256 }}\""
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
